services:
  importer:
    image: severnbli/rusguard-importer:latest
    build: .  # только для локальной сборки (importer.sh --build)
    pull_policy: always
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DISPLAY: ${DISPLAY:-:0}
      HOME: /data
    network_mode: host  # доступ к PostgreSQL в локальной сети и к X-серверу
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./data:/data  # настройки, рабочие xlsx, фото
