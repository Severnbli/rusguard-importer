name: Build Linux Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
      - '!LICENSE'
      - '!.github/**'
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!LICENSE'
      - '!.github/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: severnbli/rusguard-importer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
