name: Build Linux AppImage

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '!README.md'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/build-linux.yml'
  pull_request:
    paths:
      - '**'
      - '!README.md'
      - '!LICENSE'
      - '!.github/**'
      - '.github/workflows/build-linux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python -c "import tkinter"

      - name: Build executable
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RusGuardImporter
          --paths src
          --add-data "templates:templates"
          src/app.py

      - name: Package AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/RusGuardImporter AppDir/usr/bin/RusGuardImporter
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/RusGuardImporter" "$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/rusguard-importer.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RusGuard Importer
          Exec=RusGuardImporter
          Icon=rusguard-importer
          Categories=Office;Utility;
          Terminal=false
          EOF
          python - <<'PY'
          from PIL import Image, ImageDraw

          icon = Image.new("RGBA", (256, 256), "#24545a")
          draw = ImageDraw.Draw(icon)
          draw.ellipse((42, 50, 154, 162), outline="#f4f1df", width=24)
          draw.ellipse((78, 86, 118, 126), fill="#24545a")
          draw.rectangle((136, 94, 218, 118), fill="#f4f1df")
          draw.rectangle((186, 114, 208, 142), fill="#f4f1df")
          draw.rectangle((158, 114, 180, 136), fill="#f4f1df")
          icon.save("AppDir/usr/share/icons/hicolor/256x256/apps/rusguard-importer.png")
          PY
          curl -L --fail --silent --show-error \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage \
            AppDir dist/RusGuardImporter-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: RusGuardImporter-linux
          path: dist/RusGuardImporter-x86_64.AppImage
          if-no-files-found: error
