name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name RusGuardImporter
          --paths src
          --add-data "templates;templates"
          src/app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RusGuardImporter-windows
          path: dist/RusGuardImporter.exe
          if-no-files-found: error

  build-linux:
    uses: ./.github/workflows/build-linux.yml

  publish-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: severnbli/rusguard-importer
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-release:
    needs: [build-windows, build-linux, publish-image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: RusGuardImporter-windows
          path: dist

      - name: Download Linux build
        uses: actions/download-artifact@v4
        with:
          name: RusGuardImporter-linux
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/RusGuardImporter.exe \
              dist/RusGuardImporter-x86_64.AppImage \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/RusGuardImporter.exe \
              dist/RusGuardImporter-x86_64.AppImage \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
